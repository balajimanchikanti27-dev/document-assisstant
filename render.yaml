services:
  - type: web
    name: ai-assistant-backend
    runtime: node
    plan: free
    buildCommand: npm --prefix server install && npm --prefix server run build
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: TAVILY_API_KEY
        sync: false
