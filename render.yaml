services:
  - type: web
    name: ai-assistant-backend
    runtime: node
    plan: standard
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: ai-assistant-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5000
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: TAVILY_API_KEY
        sync: false
